<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Habé</title>
    <meta name="description" content="Application web de mode haut de gamme pour Habé, proposant des collections Homme et Enfant, des accessoires et un catalogue interactif." />
    <meta property="og:title" content="Habé" />
    <meta property="og:description" content="Application web de mode haut de gamme pour Habé, proposant des collections Homme et Enfant, des accessoires et un catalogue interactif." />
    
    <!-- Cache prevention for instant brand assets update -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon and App Icons (versioned) -->
    <link rel="icon" type="image/png" href="/favicon.png?v=20261023_v32_all_users_sync" />
    <link rel="icon" type="image/png" href="/logo.png?v=20261023_v32_all_users_sync" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261023_v32_all_users_sync" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=20261023_v32_all_users_sync" />
    <meta property="og:image" content="/logo.png?v=20261023_v32_all_users_sync" />
    
    <!-- PWA primary tags -->
    <link rel="manifest" href="/manifest.json?v=20261023_v32_all_users_sync" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS support (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habé Textile" />
    
    <!-- splash screens (pour donner l'effet appli réelle au démarrage) -->
    <link rel="apple-touch-startup-image" href="/logo.png?v=20261023_v32_all_users_sync" />

    <!-- Instant stale cache killer script -->
    <script>
      (function() {
        var currentVersion = 'habe_asset_v32_all_users_sync';
        try {
          var val = localStorage.getItem('habe_custom_logo_url');
          if (val && (val.includes('googleusercontent.com') || val.includes('176SP') || val.includes('habe-textile') || val.startsWith('data:image') || val.length > 5000)) {
            localStorage.removeItem('habe_custom_logo_url');
          }
        } catch(e) {}
        if (localStorage.getItem('habe_last_cleared_version') !== currentVersion) {
          try {
            localStorage.removeItem('habe_custom_logo_url');
          } catch(e) {}
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          localStorage.setItem('habe_last_cleared_version', currentVersion);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
